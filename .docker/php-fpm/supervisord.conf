[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/php-fpm.stdout.log
stderr_logfile=/var/log/supervisor/php-fpm.stderr.log

[program:cron]
command=/usr/sbin/cron -f -L 15
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/cron.stdout.log
stderr_logfile=/var/log/supervisor/cron.stderr.log

[program:messenger-worker]
directory=/var/www/html
command=/usr/local/bin/php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M --limit=500 --no-interaction
directory=/var/www/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/messenger_worker.stdout.log
stderr_logfile=/var/log/supervisor/messenger_worker.stderr.log
environment=APP_ENV="prod",APP_DEBUG="0",COMPOSER_ALLOW_SUPERUSER="1"
